name: Release

# Build native binaries for Windows, macOS and Linux and attach them to a
# GitHub Release when it is published. Textures are embedded into the
# executable via `include_bytes!`, so each archive is a single self-contained
# binary.
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout (with LFS assets)
        uses: actions/checkout@v7
        with:
          # The embedded textures are stored in Git LFS; without them
          # `include_bytes!` would compile LFS pointer files instead of the
          # real assets.
          lfs: true

      - name: Install Rust toolchain
        # Nightly, to match rust-toolchain.toml; .cargo/config.toml turns on
        # the unstable `codegen-backend` option, which stable cargo rejects.
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # The windowing/input libraries winit links against on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="kingdom-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" kingdom
          echo "ASSET=$archive" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "kingdom-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/kingdom.exe" -DestinationPath $archive
          echo "ASSET=$archive" >> $env:GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ env.ASSET }}
