[project]
site_name = "Kingdom"
site_description = "A single-player kingdom-builder written in Rust, rendered with wgpu."
site_url = "https://playforge-coding.github.io/kingdom/"
repo_url = "https://github.com/playforge-coding/kingdom"
repo_name = "playforge-coding/kingdom"
copyright = "Documentation licensed CC BY-NC-SA 4.0. Game code licensed AGPL-3.0-only."

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Controls & HUD" = "controls.md" },
  { "Gameplay" = "gameplay.md" },
  { "Building" = "building.md" },
  { "Units & Combat" = "units.md" },
  { "The World" = "world.md" },
  { "Saves & Files" = "saves.md" },
  { "Testing Ground" = "testing.md" },
  { "Credits" = "credits.md" },
]

extra_css = ["stylesheets/fonts.css"]

[project.theme]
custom_dir = "docs/overrides"
# Don't load webfonts from the Google Fonts CDN; we self-host them instead.
# The webfonts and stylesheets/fonts.css are generated by scripts/fetch-fonts.py.
font = false
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
  "search.suggest",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "amber"
accent = "deep orange"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "amber"
accent = "deep orange"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.details = {}
pymdownx.keys = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
# Diagrams are written as ```mermaid fences, never as ASCII art.
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
